<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - SMARTFUT</title>
    <link rel="stylesheet" href="CSS/dash.css">
    <link rel="stylesheet" href="CSS/inventario.css">
</head>
<body>
    <main class="dashboard-container">
        <aside class="sidebar">
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="inventario.html" class="active">Inventario</a>
                <a href="usuario.html">Usuarios</a>
                <a href="index.html">Volver a la Tienda</a>
            </nav>
        </aside>

        <section class="content">
            <header class="top-bar">
                <h2>Gestión de Inventario</h2>
                <button id="openProductModalBtn" class="btn-add" type="button">+ Agregar Producto</button>
            </header>

            <div class="filters-bar">
                <input id="inventorySearch" type="text" placeholder="Buscar producto..." class="search-input">
                <select id="inventoryCategory" class="filter-select">
                    <option value="">Todas las categorías</option>
                    <option value="balon">Balón</option>
                    <option value="balones">Balones</option>
                    <option value="calzado">Calzado</option>
                    <option value="indumentaria">Indumentaria</option>
                    <option value="proteccion">Protección</option>
                    <option value="entrenamiento">Entrenamiento</option>
                </select>
            </div>

            <p id="inventoryMessage" style="margin-bottom: 16px;"></p>

            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>Ref</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="productModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="productModalTitle">Agregar producto</h3>
                <button id="closeProductModalBtn" class="modal-close" type="button">x</button>
            </div>

            <form id="productForm" class="modal-form">
                <input type="hidden" id="productId">

                <label for="productNombre">Nombre</label>
                <input id="productNombre" type="text" required>

                <label for="productCategoria">Categoría</label>
                <input id="productCategoria" type="text" required>

                <label for="productPrecio">Precio</label>
                <input id="productPrecio" type="number" min="0" step="0.01" required>

                <label for="productStock">Stock</label>
                <input id="productStock" type="number" min="0" required>

                <div class="modal-actions">
                    <button type="button" id="cancelProductModalBtn" class="btn-edit">Cancelar</button>
                    <button type="submit" class="btn-add">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="script/pages/inventario-page.js"></script>
</body>
</html>
