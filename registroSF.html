<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFut</title>
    <meta name="description" content="SmartFut es una pagina web dedicada a los implementos del deporte rey como: Balones, botines, camisetas y articulos de entrenamiento">
    <meta name="keywords" content="futbol,balones,botines,camisetas,articulos de entrenamiento">
    <meta name="author" content="Javier Felipe Narvaez Cortes">
    <link rel="stylesheet" href="CSS/registro.css">
    <link rel="icon" type="image/x-icon" href="images/smarty.png">
    <link rel="shortcut icon" type="image/x-icon" href="images/smarty.png">
    
</head>
<body>
    <div class="formulario">
        <h1>Inicio de sesión</h1>
        <form id="loginForm" novalidate>
            <div class="username">
                <input id="correo" type="email" required>
                <label for="correo">Correo electrónico</label>
            </div>
            <div class="contraseña">
                <input id="contrasena" type="password" required>
                <label for="contrasena">Contraseña</label>
            </div>
            <div class="recordar">¿Olvidó su contraseña?</div>
            <input type="submit" value="Iniciar sesión">
            <p id="authMessage" style="margin-top:14px;"></p>
            <div class="registrese">No tiene una cuenta? <a href="registrese.html">Regístrese</a></div>
        </form>
    </div>
    <script type="module" src="script/pages/login.js"></script>
</body>

</html>
